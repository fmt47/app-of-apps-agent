apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    cluster-name: local-cluster
    env: prod
    region: local
    tenant: petclinic
    type: hub
  name: hpl-guestbook
  namespace: openshift-gitops
spec:
  destination:
    name: local-cluster
    namespace: guestbook
  project: default
  source:
    path: guestbook
    repoURL: https://github.com/argoproj/argocd-example-apps
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
