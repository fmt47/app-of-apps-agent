apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    argocd-agent: "true"
    cluster-name: workload-prod-local
    env: prod
    region: local
    tenant: petclinic
    type: workload
  name: wpl-guestbook
  namespace: argocd
spec:
  destination:
    name: workload-prod-local
    namespace: guestbook
  project: tenants-infra
  source:
    path: guestbook
    repoURL: https://github.com/argoproj/argocd-example-apps
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
